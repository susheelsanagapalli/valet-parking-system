name: CI

# Pushes to demo and production run this through their deploy workflows; pull requests run it on its own.
on:
  # Tested on every pull request; pushes to demo and production run it from their deploy workflows.
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run build -w sheets-integration && npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: valet-build
          path: |
            sheets-integration/dist
            server/dist
            web/dist
          retention-days: 7
