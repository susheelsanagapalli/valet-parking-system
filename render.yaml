# Render Blueprint: Render → New → Blueprint → pick this repository.
# Render deploys every push to the production branch by itself, but only after the GitHub checks (CI) pass.
services:
  - type: web
    # Live at https://valetpay.onrender.com
    name: valetpay
    runtime: node
    plan: free
    region: singapore
    branch: production
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Sign-in tokens and handover PINs are protected with these; Render generates random values.
      - key: AUTH_SECRET
        generateValue: true
      - key: PIN_HMAC_SECRET
        generateValue: true
      # Production: no demo users, demo data or Test credentials panel (the demo with test logins is
      # https://valetpay-demo.netlify.app). The first admin comes from the Secret File
      # staff-users.json (made with "npm run staff-user"); add it under Environment → Secret Files.
      # Still to do for real guests (README "Go-live checklist"): a paid plan with a disk and
      # DATA_DIR=/var/data, and Google Sheets, because on the free plan data is kept in memory only.
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO
        value: "false"
      - key: STAFF_USERS_FILE
        value: /etc/secrets/staff-users.json
      - key: SMS_PROVIDER
        value: manual
      # On a paid plan, add a disk mounted at /var/data and uncomment this so the Google
      # connection and SMS settings survive deploys and restarts.
      # - key: DATA_DIR
      #   value: /var/data
